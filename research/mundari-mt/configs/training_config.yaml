# Phase 4B: Neural Machine Translation Training Configuration
# Primary Architecture: AI4Bharat IndicTrans2 Distilled (Indic-to-Indic) + PEFT LoRA
# Note: AI4Bharat's distilled Indic-to-Indic model is 320M (ai4bharat/indictrans2-indic-indic-dist-320M).
# Language Pair: Hindi (hi) <-> Mundari (unr)
# Script Representation: Devanagari (Deva)
# IMPORTANT: IndicTrans2 is a GATED model on Hugging Face; an HF access token with accepted terms is required.
# Tokenizer expansion introduces <unr_Deva> as a dedicated identifier, but does NOT constitute 
# pretrained Mundari language knowledge. The model learns Mundari morphology from the fine-tuning corpus.

seed: 42

model:
  name: "ai4bharat/indictrans2-indic-indic-dist-320M"
  fallback_name: "ai4bharat/indictrans2-indic-indic-dist-200M"
  revision: "main"
  architecture: "IndicTransForConditionalGeneration"
  base_parameter_count: 320000000
  trust_remote_code: true
  vocab_size: 32000

tokenizer_expansion:
  enabled: true
  new_token: "<unr_Deva>"
  init_strategy: "clone_embedding"
  init_from_token: "<hin_Deva>"
  source_prefix_format: "<{src_tag}> <{tgt_tag}> {text}"

training:
  direction: "hi_to_unr" # Supported: "hi_to_unr", "unr_to_hi"
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4
  effective_batch_size: 64
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 0.01
  num_train_epochs: 6
  warmup_ratio: 0.1
  max_source_length: 128
  max_target_length: 128
  optimizer: "adamw_torch"
  lr_scheduler_type: "cosine"
  fp16: true
  bf16: false
  gradient_checkpointing: true
  dataloader_num_workers: 2
  logging_steps: 25
  eval_steps: 100
  save_steps: 200
  save_total_limit: 3

lora:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "out_proj"
  bias: "none"
  task_type: "SEQ_2_SEQ_LM"

smoke_test:
  num_train_samples: 8
  num_val_samples: 2
  overfit_steps: 10
  overfit_lr: 1.0e-3

evaluation:
  strategy: "steps"
  eval_batch_size: 16
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "chrf"
  greater_is_better: true
  early_stopping_patience: 3
  metrics:
    - "sacrebleu"
    - "chrf"
    - "exact_match"
    - "length_ratio"

hardware_requirements:
  min_gpu_vram_gb: 6.0
  recommended_gpu_vram_gb: 15.0
  recommended_platform: "Google Colab (T4 / A100) or Kaggle (2x T4)"
  local_execution_rule: "NO_LOCAL_FULL_TRAINING_ON_4GB_VRAM"

paths:
  train_data: "research/mundari-mt/cleaned-data/train.csv"
  validation_data: "research/mundari-mt/cleaned-data/validation.csv"
  test_data: "research/mundari-mt/cleaned-data/test.csv"
  checkpoints_dir: "research/mundari-mt/checkpoints"
  smoke_checkpoint_dir: "research/mundari-mt/checkpoints/smoke_test"
  logs_dir: "research/mundari-mt/logs"
  results_dir: "research/mundari-mt/results"
